<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>聲音試聽 · 查理大橋</title>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#2a241b;--mute:#8a7e6a;--line:#e7dfcf;--gold:#6e5320;--ui:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);padding:calc(18px + env(safe-area-inset-top)) 16px 32px}
.ttl{font-size:13px;letter-spacing:.12em;color:var(--mute)}h1{font-size:26px;margin:6px 0 4px}p.s{color:var(--mute);font-size:14px;margin:0 0 18px;line-height:1.6}
.v{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.v b{font-size:17px}.v small{display:block;color:var(--mute);font-size:13px;margin:2px 0 10px}
audio{width:100%}
.sp{display:flex;gap:8px;margin:14px 0 18px}.sp button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 0;font:500 15px var(--ui);color:var(--mute)}
.sp button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
</style></head><body>
<div class="ttl">2027 捷奧 · 有聲導覽</div>
<h1>查理大橋 · 聲音試聽</h1>
<p class="s">同一份稿，三種聲音，各約 4 分鐘。聽聽看哪個最像在聽人講故事。</p>
<div class="sp" id="sp"></div>
<div class="v"><b>A　台灣女聲</b><small>溫和、清楚</small><audio controls preload="none" src="charles-a.mp3"></audio></div>
<div class="v"><b>B　台灣男聲</b><small>穩、像旁白</small><audio controls preload="none" src="charles-b.mp3"></audio></div>
<div class="v"><b>C　說故事男聲</b><small>起伏比較多，大陸腔</small><audio controls preload="none" src="charles-c.mp3"></audio></div>
<script>
const S=[1,1.25,1.5,2];let r=+localStorage.getItem("rate")||1;const A=[...document.querySelectorAll("audio")];
function draw(){document.getElementById("sp").innerHTML=S.map(x=>`<button class="${x==r?"on":""}" data-r="${x}">${x}×</button>`).join("");A.forEach(a=>{a.playbackRate=r;a.defaultPlaybackRate=r})}
document.getElementById("sp").onclick=e=>{const b=e.target.closest("button");if(!b)return;r=+b.dataset.r;localStorage.setItem("rate",r);draw()};
A.forEach(a=>{a.onplay=()=>{a.playbackRate=r;A.forEach(o=>o!==a&&o.pause())}});draw();
</script></body></html>
